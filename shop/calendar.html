<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<title>SIC Cycles — Calendar</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="sic-icon-180.png">
<link rel="stylesheet" href="sh.css?v=20261121c">
<link rel="stylesheet" href="cal.css?v=20261121a">
</head>
<body>
<header class="sh-header">
  <div class="sh-brand"><a class="sh-logo-badge" href="./" aria-label="SIC Cycles Shop home"><img class="sh-logo" src="sic-logo.png" alt="SIC Cycles" width="130" height="109"></a> <small>Calendar</small></div>
  <nav class="sh-nav" id="caNav" hidden>
    <button type="button" class="sh-btn sh-btn-primary" id="caNewBtn">+ Appointment</button>
    <a class="sh-btn sh-btn-quiet" href="./">Back to shop</a>
  </nav>
</header>

<div id="caMsg" class="sh-msg" role="alert" hidden></div>

<main class="ca-main">
  <section id="caLoading" class="ca-view"><p class="sh-muted">Loading…</p></section>

  <section id="caSignedOut" class="ca-view sh-card sh-narrow" hidden>
    <h1>Sign in first</h1>
    <p id="caSignedOutText">Sign in on the shop page with a staff account, then come back here.</p>
    <a class="sh-btn sh-btn-primary" href="./">Go to shop sign in</a>
  </section>

  <section id="caMonth" class="ca-view" hidden>
    <div class="ca-bar">
      <button type="button" class="sh-btn" id="caPrev" aria-label="Previous month">‹</button>
      <h1 id="caTitle">Month</h1>
      <button type="button" class="sh-btn" id="caNext" aria-label="Next month">›</button>
      <button type="button" class="sh-btn sh-btn-quiet" id="caToday">Today</button>
    </div>
    <p class="sh-muted ca-legend"><span class="ca-dot ca-public"></span> Shop, everyone on staff sees it <span class="ca-dot ca-personal"></span> Personal, only you see it</p>
    <div class="ca-grid" id="caGrid" role="grid" aria-labelledby="caTitle"></div>
    <section class="sh-card ca-day">
      <h2 id="caDayTitle">Day</h2>
      <ul id="caDayList" class="ca-list"></ul>
      <button type="button" class="sh-btn" id="caAddDay">+ Add on this day</button>
    </section>
  </section>

  <section id="caEdit" class="ca-view" hidden>
    <form id="caForm" class="sh-narrow ca-form" novalidate>
      <h1 id="caFormTitle">New appointment</h1>
      <fieldset class="sh-card">
        <legend>Appointment</legend>
        <label>What is it? * <input id="caTitleIn" maxlength="200" autocomplete="off" required></label>
        <div class="sh-grid2">
          <label>Date * <input id="caDate" type="date" required></label>
          <label class="ca-check"><input id="caAllDay" type="checkbox"> All day</label>
          <label>Start <input id="caStart" type="time" value="09:00"></label>
          <label>End <input id="caEnd" type="time" value="10:00"></label>
        </div>
        <div class="ca-vis" role="radiogroup" aria-label="Who sees it">
          <label class="ca-check"><input type="radio" name="caVis" value="public" checked> Shop: everyone on staff sees it</label>
          <label class="ca-check"><input type="radio" name="caVis" value="personal"> Personal: only I see it</label>
        </div>
      </fieldset>
      <fieldset class="sh-card" id="caLinks">
        <legend>Customer (optional)</legend>
        <label>Customer <select id="caCustomer"></select></label>
        <label>Bike <select id="caBike"></select></label>
        <label>Job <select id="caJob"></select></label>
      </fieldset>
      <fieldset class="sh-card">
        <legend>Notes</legend>
        <textarea id="caNotes" rows="3" maxlength="2000" aria-label="Notes"></textarea>
      </fieldset>
      <p class="sh-muted" id="caStamp"></p>
      <div class="sh-actions">
        <button type="submit" class="sh-btn sh-btn-primary" id="caSave">Save</button>
        <button type="button" class="sh-btn" id="caCancelAppt" hidden>Cancel appointment</button>
        <button type="button" class="sh-btn sh-btn-quiet" id="caBack">Back</button>
      </div>
    </form>
  </section>
</main>

<script src="../supabase-config.js"></script>
<script src="../session-store.js"></script>
<script src="sh-api.js?v=20261030a"></script>
<script src="cal-app.js?v=20261121a"></script>
</body>
</html>
